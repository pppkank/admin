<style>
:root{--g9:#14361a;--g8:#1d4a22;--g7:#28602c;--g6:#2f7233;--g1:#e4efe2;--g0:#f1f7ef;--gold:#e3a923;--gold6:#c98f12;--gold3:#f2cf73;--gold1:#fbf0d2;
--cream:#fbf9f3;--ink:#18231a;--muted:#5b6a5d;--line:#e2e6dc;--red:#b3261e;--red0:#fdecea;--blue:#1d5fa8;--blue0:#e7f0fb;
--sans:"Plus Jakarta Sans",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif;--sh:0 10px 30px -14px rgba(20,54,26,.28)}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:999px;font-weight:800;font-size:.88rem;border:1.5px solid transparent;text-decoration:none;transition:background .15s,transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn svg{width:16px;height:16px}
.b-green{background:var(--g7);color:#fff}.b-green:hover{background:var(--g8)}
.b-gold{background:var(--gold);color:var(--g9)}.b-gold:hover{background:var(--gold3)}
.b-ghost{background:#fff;border-color:var(--line);color:var(--g8)}.b-ghost:hover{background:var(--g0)}
.b-red{background:#fff;border-color:#f0c4c0;color:var(--red)}.b-red:hover{background:var(--red0)}
.b-sm{padding:6px 12px;font-size:.8rem}
.btn[disabled]{opacity:.55;pointer-events:none}
input,select,textarea{font:inherit;font-size:.93rem;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g6)}
label.l{display:block;font-size:.78rem;font-weight:800;color:var(--g8);margin:12px 0 5px}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 85% -10%,rgba(227,169,35,.25),transparent 60%),linear-gradient(160deg,var(--g9),var(--g7))}
.lcard{background:#fff;border-radius:24px;padding:34px 30px;width:100%;max-width:400px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.lcard img{width:84px;height:84px;display:block;margin:0 auto 12px}
.lcard h1{font-family:var(--serif);text-align:center;color:var(--g9);font-size:1.6rem}
.lcard p.s{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:10px}
.lcard .btn{width:100%;margin-top:18px;padding:13px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:.78rem;font-weight:800}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.86rem}
.msg.err{background:var(--red0);color:var(--red)}.msg.ok{background:#e3f4df;color:#1e6b25}.msg.info{background:var(--gold1);color:#6b4a00}

/* SHELL */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--g9);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
@media (max-height:780px){aside{padding:14px 12px}.brand{padding-bottom:12px;margin-bottom:6px}nav a{padding:7px 12px}nav .sep{padding:8px 12px 4px}.who{padding-top:10px}.who button{margin-top:6px}}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand img{width:42px;height:42px;background:#fff;border-radius:50%}
.brand b{display:block;font-size:.98rem}.brand small{display:block;font-size:.72rem;color:var(--gold3)}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:600;font-size:.9rem;margin-bottom:2px;cursor:pointer}
nav a svg{width:18px;height:18px;flex:none}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:rgba(227,169,35,.18);color:#fff}
nav a .cnt{margin-left:auto;background:var(--gold);color:var(--g9);font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px}
nav .sep{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:14px 12px 6px;font-weight:800}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:.84rem}
.who b{display:block}.who span{color:var(--gold3);font-size:.75rem}
.who button{margin-top:10px;background:rgba(255,255,255,.1);border:0;color:#fff;padding:7px 12px;border-radius:999px;font-weight:700;font-size:.8rem}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-family:var(--serif);font-size:1.8rem;color:var(--g9);line-height:1.15}
.top p{color:var(--muted);font-size:.92rem}
.mobilebar{display:none}

/* KAD */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card h3{font-size:1rem;color:var(--g9);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;cursor:default}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--g6)}
.tile b{display:block;font-family:var(--serif);font-size:2.1rem;color:var(--g7);line-height:1.1}
.tile span{font-size:.84rem;color:var(--muted)}
.tile.hl{background:linear-gradient(150deg,var(--g8),var(--g6));border:0;color:#fff}.tile.hl b{color:var(--gold3)}.tile.hl span{color:rgba(255,255,255,.8)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .15s;background:#fff}
.lnk:hover{border-color:var(--g6)}
.lnk i{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--g0);color:var(--g7)}
.lnk i svg{width:19px;height:19px}
.lnk b{display:block;font-size:.86rem;color:var(--g9)}.lnk small{font-size:.74rem;color:var(--muted)}
.lnk.off{opacity:.5;pointer-events:none}

/* JADUAL */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input{max-width:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.8rem;color:var(--muted)}
.chip.on{background:var(--g7);border-color:var(--g7);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--g0);padding:11px 14px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafcf8}
.tbl .nm{font-weight:700;color:var(--g9)}
.tbl small{color:var(--muted);display:block;font-size:.76rem}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:800;white-space:nowrap}
.st.Baharu{background:var(--gold1);color:#7a5200}.st.Disahkan{background:var(--blue0);color:var(--blue)}
.st.Diluluskan,.st.Aktif{background:#e1f3dd;color:#1e6b25}.st.Ditolak,.st.Tamat{background:var(--red0);color:var(--red)}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* MODAL / LACI */
.ov{position:fixed;inset:0;background:rgba(20,54,26,.55);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--cream);width:min(760px,100%);height:100%;overflow:auto;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4);animation:sl .2s ease}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2}
.dh h3{font-family:var(--serif);font-size:1.3rem;color:var(--g9)}
.dh small{color:var(--muted);font-size:.8rem}
.x{border:0;background:var(--g0);width:36px;height:36px;border-radius:50%;font-size:1.2rem;color:var(--g8)}
.db{padding:20px 22px}
.kv{display:grid;grid-template-columns:190px 1fr;font-size:.88rem;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{padding:8px 14px;border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--muted);font-weight:600;background:#fbfcfa}.kv .v{font-weight:600;white-space:pre-line;word-break:break-word}
.files{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.fprev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.fprev h4{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.fprev img{width:100%;border-radius:8px;max-height:420px;object-fit:contain;background:var(--g0)}
.fprev iframe{width:100%;height:380px;border:0;border-radius:8px;background:var(--g0)}
.act{background:#fff;border:1.5px solid var(--g1);border-radius:16px;padding:16px;margin-top:16px}
.act h4{font-size:.95rem;color:var(--g9);margin-bottom:4px}
.act p{font-size:.84rem;color:var(--muted)}
.act .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sugg{background:var(--g0);border-radius:12px;padding:12px;font-size:.86rem;margin-top:10px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;margin-top:10px;cursor:pointer}
.chk input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--g7)}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem;padding:20px}
.spin{width:22px;height:22px;border:3px solid var(--g1);border-top-color:var(--g7);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--g9);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:.88rem;z-index:99;box-shadow:var(--sh)}
.toast.err{background:var(--red)}

.sigw{border:2px solid var(--line);border-radius:14px;background:#fff;position:relative;touch-action:none}
.sigw.bad{border-color:var(--red)}
.sigw canvas{display:block;width:100%;height:150px;cursor:crosshair}
.sigw .ln{position:absolute;left:20px;right:20px;bottom:34px;border-bottom:1.5px dashed #c9d1c6;pointer-events:none}
.sigw .ph{position:absolute;inset:0;display:grid;place-items:center;color:#a6b0a7;font-weight:600;pointer-events:none}
.lk{background:none;border:0;color:var(--red);font:inherit;font-weight:700;font-size:.8rem;cursor:pointer}
/* DOKUMEN */
.cur{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(150deg,var(--g8),var(--g6));color:#fff;border-radius:20px;padding:22px}
.cur .ic{width:62px;height:76px;border-radius:10px;background:#fff;color:var(--g7);display:grid;place-items:center;font-weight:800;font-size:.8rem;box-shadow:6px 6px 0 rgba(227,169,35,.6)}
.cur h3{font-family:var(--serif);font-size:1.35rem}
.cur p{font-size:.86rem;color:rgba(255,255,255,.85)}
.cur .badge{display:inline-block;background:var(--gold);color:var(--g9);font-weight:800;font-size:.72rem;padding:3px 10px;border-radius:999px;margin-bottom:6px}
.doclist{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.doc .ic{width:40px;height:48px;border-radius:8px;background:var(--g0);color:var(--g7);display:grid;place-items:center;font-size:.66rem;font-weight:800}
.doc b{display:block;font-size:.92rem;color:var(--g9)}.doc small{color:var(--muted);font-size:.78rem}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kat{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g7);margin:18px 0 8px}
.up{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.up .full{grid-column:1/-1}
details.card summary{cursor:pointer;font-weight:800;color:var(--g8);list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:"+";font-size:1.2rem}details.card[open] summary::after{content:"–"}

@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;background:var(--g9);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:40}
  .mobilebar button{background:none;border:0;color:#fff}
  main{padding:20px 16px 60px}
  .links,.files,.up{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}.kv .k{border-top:1px solid var(--line)!important;padding-bottom:2px}.kv .v{border-top:0!important;padding-top:2px}
  .cur{grid-template-columns:1fr}.doc{grid-template-columns:auto 1fr}.doc .acts{grid-column:1/-1;justify-content:flex-start}
}
.xtabs{display:flex;gap:6px;margin:-4px 0 16px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}.xtabs button{font:inherit;font-weight:800;font-size:.9rem;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;margin-bottom:-1.5px}.xtabs button.on{color:var(--g8);border-bottom-color:var(--gold)}.xtabs i{font-style:normal;background:var(--gold);color:#fff;border-radius:999px;padding:1px 7px;font-size:.72rem;margin-left:4px}
</style>
</head>

<script>
/* =================== TETAPAN =================== */
const API_URL = "https://script.google.com/macros/s/AKfycbzFLxLtxB4NPNncqNmOOx8N8UD1HSmKuCRKxQqFA0OPl-s9yC2eCsKtuyAs7FhHYBc/exec";     // URL Web App Apps Script (sama dengan portal pendaftaran)
/* =============================================== */

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  reg:'<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3.5-6.5 7-6.5M17 14v6M14 17h6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M15 14.5c3 0 6 1.8 6 5"/>',
  book:'<path d="M4 19.5V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM8 7h7M8 11h5"/>',
  file:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  log:'<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',

  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  minit:'<path d="M9 4h6l1 2h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3z"/><path d="M8 12h8M8 16h5"/>',
  sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',

  up:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v3a2 2 0 01-2 2H6a2 2 0 01-2-2v-3"/>',
  dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

let TOKEN=null, USER=null, CACHE={};
try{ TOKEN=sessionStorage.getItem("pppkank_tok"); USER=JSON.parse(sessionStorage.getItem("pppkank_user")||"null"); }catch(e){}

async function api(action, data={}){
  if(!API_URL) throw new Error("API_URL belum ditetapkan dalam fail ini.");
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action,token:TOKEN},data))});
  const j=await r.json();
  if(j.auth===false){ forceLogout(j.message); throw new Error(j.message); }
  if(!j.ok) throw new Error(j.message||"Ralat tidak diketahui.");
  return j;
}
function toast(m,err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3800); }
const loading=(t="Memuatkan…")=>`<div class="loading"><div class="spin"></div>${t}</div>`;
const CAP=k=>!!(USER&&USER.caps&&USER.caps[k]); const OKP=n=>!n||n==="all"||CAP(n);

/* ---------- LOG MASUK ---------- */
$("loginForm").onsubmit=async e=>{
  e.preventDefault(); const b=$("lbtn"); b.disabled=true; b.textContent="Mengesahkan…"; $("lmsg").innerHTML="";
  try{
    const j=await api("login",{username:$("lu").value.trim(),password:$("lp").value});
    TOKEN=j.token; USER=j.user;
    try{ sessionStorage.setItem("pppkank_tok",TOKEN); sessionStorage.setItem("pppkank_user",JSON.stringify(USER)); }catch(e){}
    $("lp").value=""; start();
  }catch(err){ $("lmsg").innerHTML=`<div class="msg err">${esc(err.message)}</div>`; }
  finally{ b.disabled=false; b.textContent="Log Masuk"; }
};
function forceLogout(m){ TOKEN=null; USER=null; try{sessionStorage.clear()}catch(e){} $("app").hidden=true; $("login").hidden=false; closeDrawer(); if(m) $("lmsg").innerHTML=`<div class="msg info">${esc(m)}</div>`; }
async function logout(){ try{ await api("logout"); }catch(e){} forceLogout("Anda telah log keluar."); }

/* ---------- NAVIGASI ---------- */
const PAGES=[
  {id:"utama",t:"Utama",ic:"home"},
  {id:"pendaftaran",t:"Pendaftaran",ic:"reg",cnt:true},
  {id:"ahli",t:"Senarai Ahli",ic:"users"},
  {id:"pkb",t:"Perbelanjaan",ic:"money",cnt:true},
  {sep:"Dokumen"},
  {id:"perlembagaan",t:"Perlembagaan",ic:"book"},
  {id:"borang",t:"Borang",ic:"file"},
  {sep:"Sistem"},
  {id:"pengguna",t:"Pengguna",ic:"key",need:"admin"},
  {id:"log",t:"Log Aktiviti",ic:"log",need:"admin"},
  {id:"tetapan",t:"Tetapan",ic:"cog",need:"admin"},
  {id:"akaun",t:"Akaun Saya",ic:"key"}
];
function buildNav(){
  $("nav").innerHTML=PAGES.filter(p=>p.sep?(p.sep!=="Sistem"||true):OKP(p.need)).map(p=>p.sep?`<div class="sep">${p.sep}</div>`:
    `<a data-p="${p.id}" onclick="go('${p.id}')">${svg(p.ic)}${p.t}${p.cnt?`<span class="cnt" id="cnt_${p.id}" hidden></span>`:""}</a>`).join("");
  $("whoN").textContent=USER.nama||USER.username; $("whoR").textContent=USER.peranan;
}
function go(p){
  location.hash=p; $("side").classList.remove("open");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
  if(USER.mustChange && p!=="akaun") return go("akaun");
  const page=PAGES.find(x=>x.id===p); if(!page||!OKP(page.need)) return go("utama");
  window.scrollTo(0,0); R[p]();
}
function head(t,s,right=""){ return `<div class="top"><div><h2>${t}</h2><p>${s||""}</p></div><div>${right}</div></div>`; }
function setCnt(n,id="pendaftaran"){ const c=$("cnt_"+id); if(c){ c.hidden=!n; c.textContent=n; } }

/* ---------- HALAMAN ---------- */
const R={};

R.utama=async()=>{
  const m=$("main"); m.innerHTML=head(`Selamat datang, ${esc((USER.nama||USER.username).split(" ").slice(0,3).join(" "))}`,"Ringkasan keahlian dan akses pantas dokumen persatuan.")+loading();
  try{
    const d=await api("dashboard"); CACHE.settings=d.settings; setCnt(d.reg.baharu+d.reg.disahkan);
    const s=d.settings, L=(href,ic,t,sub)=>`<a class="lnk${href?"":" off"}" href="${esc(href||"#")}" target="_blank" rel="noopener"><i>${svg(ic)}</i><span><b>${t}</b><small>${href?sub:"Belum ditetapkan"}</small></span></a>`;
    m.innerHTML=head(`Selamat datang, ${esc((USER.nama||USER.username).split(" ").slice(0,3).join(" "))}`,"Ringkasan keahlian dan akses pantas dokumen persatuan.")+`
    <div class="tiles">
      <div class="tile hl click" onclick="go('pendaftaran')"><b>${d.reg.baharu}</b><span>Pendaftaran baharu menunggu semakan</span></div>
      <div class="tile click" onclick="go('pendaftaran')"><b>${d.reg.disahkan}</b><span>Bayaran disahkan, menunggu kelulusan</span></div>
      <div class="tile click" onclick="go('ahli')"><b>${d.members.aktif}</b><span>Ahli aktif (daripada ${d.members.jumlah})</span></div>
      <div class="tile click" onclick="go('ahli')"><b>${d.members.tamat}</b><span>Keahlian tamat / perlu diperbaharui</span></div>
    </div>
    ${d.members.error?`<div class="msg err" style="margin-bottom:14px">Senarai Ahli: ${esc(d.members.error)}</div>`:""}
    <div class="grid2">
      <div class="card"><h3>Permohonan terkini <button class="btn b-ghost b-sm" onclick="go('pendaftaran')">Lihat semua</button></h3>
        ${d.recent.length?`<div class="tblw"><table class="tbl"><tbody>${d.recent.map(r=>`<tr class="click" onclick="openReg('${esc(r.ref)}')"><td><span class="nm">${esc(r.nama)}</span><small>${esc(r.ref)} · ${esc(r.tarikh)}</small></td><td><small>${esc(r.jenis)}${r.tahun&&r.tahun!=="Seumur Hidup"?" "+esc(r.tahun):""}</small></td><td>${stBadge(r.status)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada permohonan.</div>`}
      </div>
      <div class="card"><h3>Akses pantas</h3>
        <div class="links">
          ${L(s.URL_WEB,"globe","Laman Persatuan","pppkank.github.io/page")}
          ${L(s.URL_DAFTAR,"form","Portal Pendaftaran","Pendaftaran & pembaharuan")}

function drawReg(){

  $("regChips").innerHTML=Object.entries(F).map(([k,[t,f]])=>`<button class="chip${REG_FILTER===k?" on":""}" onclick="REG_FILTER='${k}';drawReg()">${t} (${CACHE.regs.filter(f).length})</button>`).join("");
  const q=REG_Q.toLowerCase(); const rows=CACHE.regs.filter(F[REG_FILTER][1]).filter(r=>!q||(r.nama+r.ref+r.tempat).toLowerCase().includes(q));

function b64Blob(b64,type){ const bin=atob(b64),u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
function closeDrawer(){ $("ov").hidden=true; $("drawer").innerHTML=""; }
async function openReg(ref){
  $("ov").hidden=false; $("drawer").innerHTML=`<div class="dh"><div><h3>Butiran permohonan</h3><small>${esc(ref)}</small></div><button class="x" onclick="closeDrawer()">×</button></div><div class="db">${loading()}</div>`;
  try{
    const d=await api("regDetail",{ref}); const s=d.summary;
    const mgr=CAP("keahlian"), done=s.status==="Diluluskan";
    const sg=d.suggest||{};
    let sugg="";
    if(sg.kind==="new") sugg=sg.existing?`<div class="msg err">No. KP ini sudah wujud dalam Senarai Ahli sebagai <b>${esc(sg.existing)}</b>. Mungkin pendaftaran berganda. Gunakan pilihan kemas kini manual jika perlu.</div>`:`Akan ditambah ke Senarai Ahli sebagai ahli baharu. Cadangan No. Ahli:`;
    if(sg.kind==="renew") sugg=sg.found?`Ahli ditemui dalam Senarai Ahli: <b>${esc(sg.noAhli)} — ${esc(sg.nama)}</b>. Yuran akan direkodkan pada rekod ini.`:`<div class="msg err">Ahli dengan No. KP ini <b>tidak ditemui</b> dalam Senarai Ahli. Semak No. KP dalam sheet, atau luluskan dengan pilihan kemas kini manual.</div>`;
    if(sg.kind==="error") sugg=`<div class="msg err">${esc(sg.message)}</div>`;
    $("drawer").innerHTML=`<div class="dh"><div><h3>${esc(s.nama)}</h3><small>${esc(s.ref)} · ${esc(s.jenis)}${s.tahun&&s.tahun!=="Seumur Hidup"?" "+esc(s.tahun):""} · RM${esc(s.jumlah)}</small></div><div style="display:flex;gap:10px;align-items:center">${stBadge(s.status)}<button class="x" onclick="closeDrawer()">×</button></div></div>
    <div class="db">
      <div class="files">
        <div class="fprev"><h4>Bukti bayaran ${d.hasResit?`<button class="btn b-ghost b-sm" onclick="openRegFile('${esc(ref)}','resit',true)">Buka</button>`:""}</h4><div id="pvResit">${d.hasResit?loading("Memuatkan resit…"):"Tiada fail."}</div></div>
        <div class="fprev"><h4>Borang keahlian</h4>${d.hasBorang?`<p style="font-size:.85rem;color:var(--muted)">Borang PDF yang dijana semasa pendaftaran.</p><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn b-ghost b-sm" onclick="openRegFile('${esc(ref)}','borang',true)">${svg("eye")}Lihat</button><button class="btn b-ghost b-sm" onclick="openRegFile('${esc(ref)}','borang',false)">${svg("dl")}Muat turun</button></div>`:"Tiada fail."}</div>
      </div>
      <div class="kv">${d.fields.map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v">${esc(v||"-")}</div>`).join("")}</div>
      ${mgr&&!done?`
      <div class="act"><h4>Tindakan</h4><p>Semak bukti bayaran sebelum mengesahkan. Semua tindakan direkodkan dalam log.</p>
        <label class="l">Catatan (pilihan; wajib untuk "Tidak Diluluskan")</label><textarea id="actNote" rows="2"></textarea>
        <div class="row">
          ${s.status==="Baharu"?`<button class="btn b-ghost" onclick="regAct('${esc(ref)}','verify')">✓ Sahkan Bayaran</button>`:""}
          <button class="btn b-red" onclick="regAct('${esc(ref)}','reject')">Tidak Diluluskan</button>
        </div>
      </div>
      <div class="act" style="border-color:var(--gold3)"><h4>Luluskan &amp; aktifkan keahlian</h4>
        <div class="sugg">${sugg}${sg.kind==="new"&&!sg.existing?`<input id="actNo" value="${esc(sg.noAhli||"")}" style="max-width:160px;margin-top:8px;display:block">`:""}</div>
        <label class="chk"><input type="checkbox" id="actSkip" ${(sg.kind==="renew"&&!sg.found)||sg.existing||sg.kind==="error"?"checked":""}> Senarai Ahli telah / akan dikemas kini secara manual (jangan ubah Senarai Ahli secara automatik)</label>
        <label class="chk"><input type="checkbox" id="actMail" checked> Emel makluman kelulusan kepada ahli</label>
        <div class="row"><button class="btn b-gold" id="apBtn" onclick="regAct('${esc(ref)}','approve')">Luluskan &amp; Aktifkan</button></div>
      </div>`:(mgr&&done?`<div class="act"><h4>Telah diluluskan</h4><p>Permohonan ini telah diluluskan${s.noAhli?" (No. Ahli "+esc(s.noAhli)+")":""}. Sebarang pembetulan boleh dibuat terus dalam Google Sheet.</p><label class="l">Tambah catatan</label><textarea id="actNote" rows="2"></textarea><div class="row"><button class="btn b-ghost" onclick="regAct('${esc(ref)}','note')">Simpan catatan</button></div></div>`:"")}
    </div>`;
    if(d.hasResit) previewResit(ref);
  }catch(e){ $("drawer").querySelector(".db").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
}
async function previewResit(ref){
  try{
    const f=await api("regFile",{ref,kind:"resit"}); const url=URL.createObjectURL(b64Blob(f.data,f.mime));
    const el=$("pvResit"); if(!el) return;
    el.innerHTML=/^image\//.test(f.mime)?`<a href="${url}" target="_blank"><img src="${url}" alt="Resit"></a>`:/pdf/.test(f.mime)?`<iframe src="${url}"></iframe>`:`<a class="btn b-ghost b-sm" href="${url}" download="${esc(f.name)}">Muat turun ${esc(f.name)}</a>`;
  }catch(e){ const el=$("pvResit"); if(el) el.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
}
async function openRegFile(ref,kind,view){
  toast("Memuatkan fail…");
  try{ const f=await api("regFile",{ref,kind}); openBlob(f, view); }catch(e){ toast(e.message,true); }
}
function openBlob(f,view){
  const url=URL.createObjectURL(b64Blob(f.data,f.mime));
  if(view && /pdf|image/.test(f.mime)){ const w=window.open(url,"_blank"); if(w) return; }
  const a=document.createElement("a"); a.href=url; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
}
async function regAct(ref,op){
  const note=($("actNote")||{}).value||"";
  const payload={ref,op,catatan:note};
  if(op==="approve"){
    payload.skipSync=$("actSkip").checked; payload.emel=$("actMail").checked; payload.noAhli=($("actNo")||{}).value||"";
    if(!confirm(`Luluskan permohonan ${ref}?${payload.skipSync?"\n\nSenarai Ahli TIDAK akan diubah (manual).":"\n\nSenarai Ahli akan dikemas kini secara automatik."}`)) return;
  }
  if(op==="reject"&&!note.trim()){ toast("Sila nyatakan sebab dalam ruang catatan.",true); return; }
  if(op==="reject"&&!confirm(`Tandakan ${ref} sebagai Tidak Diluluskan?`)) return;
  document.querySelectorAll(".act .btn").forEach(b=>b.disabled=true);
  try{ const j=await api("regUpdate",payload); toast(j.message); closeDrawer(); R.pendaftaran(); }
  catch(e){ toast(e.message,true); document.querySelectorAll(".act .btn").forEach(b=>b.disabled=false); }
}

const extOf=n=>(String(n).match(/\.(\w+)$/)||[,"FAIL"])[1].toUpperCase();
const fsz=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
async function openDoc(id,view=true){ toast("Memuatkan dokumen…"); try{ const f=await api("docGet",{id}); openBlob(f,view); }catch(e){ toast(e.message,true); } }
function readB64(file){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=no; r.readAsDataURL(file); }); }

function SigPad(host){
  host.innerHTML=`<div class="sigw"><canvas></canvas><div class="ln"></div><div class="ph">Tandatangan di sini</div></div><div style="text-align:right;margin-top:4px"><button type="button" class="lk">Padam</button></div>`;
  const w=host.querySelector(".sigw"), cv=host.querySelector("canvas"), cx=cv.getContext("2d"), ph=host.querySelector(".ph"); let draw=false,has=false,last=null;
  const size=()=>{ const r=cv.getBoundingClientRect(); if(!r.width) return; const d=Math.max(2,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; cx.setTransform(d,0,0,d,0,0); cx.lineCap="round"; cx.lineJoin="round"; cx.strokeStyle="#0d2a6b"; cx.lineWidth=2.3; has=false; ph.style.display=""; };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown",e=>{ if(!cv.width) size(); draw=true; last=pos(e); cv.setPointerCapture(e.pointerId); has=true; ph.style.display="none"; w.classList.remove("bad"); });
  cv.addEventListener("pointermove",e=>{ if(!draw) return; const p=pos(e); cx.beginPath(); cx.moveTo(last.x,last.y); cx.lineTo(p.x,p.y); cx.stroke(); last=p; });
  ["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>draw=false));
  host.querySelector(".lk").onclick=size; setTimeout(size,60);
  return { has:()=>has, mark:()=>w.classList.add("bad"), png:()=>{
    const W=cv.width,H=cv.height,d=cx.getImageData(0,0,W,H).data; let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2) if(d[(y*W+x)*4+3]>10){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
    if(x1<=x0) return null; const p=14; x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(W,x1+p);y1=Math.min(H,y1+p);
    const s=Math.min(1,600/(x1-x0)), o=document.createElement("canvas"); o.width=Math.round((x1-x0)*s); o.height=Math.round((y1-y0)*s);
    o.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height); return o.toDataURL("image/png"); } };
}

let PKB_F="todo", PKB_Q="", PKB_Y="";
function myTodo(r){ const c=USER.caps||{}; return (c.kewangan&&["Menunggu Semakan","Diluluskan","Dibayar"].includes(r.status))||(c.slot==="PENGERUSI"&&r.status==="Menunggu Kelulusan"&&!r.pengerusi)||(c.slot==="SETIAUSAHA"&&r.status==="Menunggu Kelulusan"&&!r.setiausaha&&CACHE.pkbMode==="TIGA"); }
R.pkb=async()=>{

function drawPkb(){
  const all=CACHE.pkb, yr=all.filter(r=>r.tahun===PKB_Y);
  const lulus=yr.filter(r=>["Diluluskan","Dibayar","Selesai"].includes(r.status)), bayar=yr.filter(r=>["Dibayar","Selesai"].includes(r.status));
  const sum=a=>a.reduce((x,r)=>x+r.jumlah,0), sumB=a=>a.reduce((x,r)=>x+(r.dibayar||0),0);
  $("pkbTiles").innerHTML=`<div class="tile hl"><b>${all.filter(myTodo).length}</b><span>Perlu tindakan saya</span></div>
    <div class="tile"><b>${all.filter(r=>["Menunggu Semakan","Menunggu Kelulusan","Menunggu Sokongan"].includes(r.status)).length}</b><span>Dalam proses semakan / kelulusan</span></div>
    <div class="tile"><b style="font-size:1.5rem">${RM(sum(lulus))}</b><span>Diluluskan ${esc(PKB_Y)}</span></div>
    <div class="tile"><b style="font-size:1.5rem">${RM(sumB(bayar))}</b><span>Telah dibayar ${esc(PKB_Y)}</span></div>`;
  const F={todo:["Perlu tindakan saya",myTodo],semua:["Semua",()=>true],proses:["Dalam proses",r=>["Menunggu Sokongan","Menunggu Semakan","Menunggu Kelulusan","Dikuiri"].includes(r.status)],
    lulus:["Diluluskan (belum bayar)",r=>r.status==="Diluluskan"],bayar:["Dibayar",r=>r.status==="Dibayar"],selesai:["Selesai",r=>r.status==="Selesai"],tolak:["Ditolak / batal",r=>["Tidak Diluluskan","Dibatalkan"].includes(r.status)]};
  $("pkbChips").innerHTML=Object.entries(F).map(([k,[t,f]])=>`<button class="chip${PKB_F===k?" on":""}" onclick="PKB_F='${k}';drawPkb()">${t} (${all.filter(f).length})</button>`).join("");
  const q=PKB_Q.toLowerCase(); const rows=all.filter(F[PKB_F][1]).filter(r=>PKB_F==="todo"||PKB_F==="proses"||r.tahun===PKB_Y).filter(r=>!q||(r.ref+r.pemohon+r.penerima+r.jawatankuasa).toLowerCase().includes(q));
  $("pkbBody").innerHTML=rows.map(r=>`<tr class="click" onclick="openPkb('${esc(r.ref)}')"><td><b>${esc(r.ref)}</b><small>${esc(r.tarikh)}</small></td><td><span class="nm">${esc(r.jawatankuasa)}</span><small>${esc(r.pemohon)}</small></td><td>${esc(r.penerima)}</td><td style="text-align:right;font-weight:700">${RM(r.jumlah)}</td><td>${pkbBadge(r.status)}${r.baucar?`<small>${esc(r.baucar)}</small>`:""}${r.status==="Menunggu Kelulusan"?`<small>${r.pengerusi?"✓":"○"} Pengerusi${CACHE.pkbMode==="TIGA"?` · ${r.setiausaha?"✓":"○"} Setiausaha`:""}</small>`:""}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Tiada PKB dalam kategori ini.</td></tr>`;
  const g={}; yr.forEach(r=>{ const k=r.jawatankuasa||"-"; g[k]=g[k]||{n:0,l:0,b:0}; g[k].n++; if(["Diluluskan","Dibayar","Selesai"].includes(r.status)) g[k].l+=r.jumlah; g[k].b+=r.dibayar||0; });
  $("pkbYl").textContent="· "+PKB_Y;
  $("pkbSum").innerHTML=Object.entries(g).sort((a,b)=>b[1].l-a[1].l).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${v.n}</td><td style="text-align:right">${RM(v.l)}</td><td style="text-align:right">${RM(v.b)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Tiada data.</td></tr>`;
}

async function pkbAct(action,op,ref){

async function tntAct(action,op,ref){
  const ul=($("aUl")||{}).value||"";
  if(op!=="sah"&&op!=="lulus"&&!ul.trim()) return toast("Sila isi ulasan.",true);
  const payload={ref,op,ulasan:ul};
  try{
    if(op==="sah"||op==="lulus") Object.assign(payload,SIGSEL.get());
    if(op==="sah"){ payload.amaun=$("aAmt").value; payload.rujukan=($("aRuj")||{}).value||""; }
    const label={sah:`Sahkan tuntutan sebanyak ${RM(payload.amaun)} dan tandatangan?`,lulus:"Luluskan dan tandatangan tuntutan ini?",kuiri:"Kembalikan tuntutan kepada penuntut untuk pembetulan?",tolak:"Tandakan tuntutan ini sebagai tidak disokong / tidak diluluskan?"}[op];
    if(!confirm(label)) return;
    document.querySelectorAll(".act .btn").forEach(b=>b.disabled=true);
    const j=await api(action,payload); toast(j.message); closeDrawer(); R.tnt();
  }catch(e){ toast(e.message,true); document.querySelectorAll(".act .btn").forEach(b=>b.disabled=false); }
}
async function tntPay(ref){
  try{
    const payload=Object.assign({ref,tarikh:$("pTar").value,cara:$("pCara").value,amaun:$("pAmt").value,rujukan:$("pRuj").value},SIGSEL.get());
    const f=$("pBukti").files[0]; if(f){ if(f.size>10*1048576) return toast("Bukti bayaran melebihi 10 MB.",true); payload.bukti={name:f.name,type:f.type,data:await readB64(f)}; }
    if(!confirm(`Rekod bayaran ${RM(payload.amaun)} dan jana Baucar Bayaran?`)) return;
    document.querySelectorAll(".act .btn").forEach(b=>b.disabled=true);
    const j=await api("tntPay",payload); toast(j.message); closeDrawer(); R.tnt();
  }catch(e){ toast(e.message,true); document.querySelectorAll(".act .btn").forEach(b=>b.disabled=false); }
}
async function tntDel(ref){
  if($("delConf").value.trim()!==ref) return toast("Taip No. Tuntutan dengan tepat untuk mengesahkan.",true);
  if(!$("delWhy").value.trim()) return toast("Sila nyatakan sebab.",true);
  if(!confirm(`Padam ${ref} secara kekal daripada sistem?`)) return;
  try{ const j=await api("tntDelete",{ref,confirm:$("delConf").value.trim(),sebab:$("delWhy").value.trim()}); toast(j.message); closeDrawer(); R.tnt(); }catch(e){ toast(e.message,true); }
}
async function tntClose(ref){
  try{ const payload={ref,nota:$("cNota").value}; const f=$("cFail").files[0]; if(f) payload.fail={name:f.name,type:f.type,data:await readB64(f)};
    if(!confirm("Tutup tuntutan ini sebagai Selesai?")) return; const j=await api("tntClose",payload); toast(j.message); closeDrawer(); R.tnt(); }catch(e){ toast(e.message,true); }
}

function pwT(b){ const i=b.previousElementSibling; i.type=i.type==="password"?"text":"password"; b.textContent=i.type==="password"?"LIHAT":"SOROK"; }
function sigTab(m){ window._sigMode=m; $("sgTabD").classList.toggle("on",m==="d"); $("sgTabU").classList.toggle("on",m==="u"); $("mySig").hidden=m!=="d"; $("sgUp").hidden=m!=="u"; if(m==="d") setTimeout(()=>$("mySig").querySelector(".lk").click(),30); }

function procSig(){
  const im=window._sigImg, s=Math.min(1,1400/Math.max(im.width,im.height)), W=Math.round(im.width*s), H=Math.round(im.height*s);
  const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.drawImage(im,0,0,W,H);
  const img=x.getImageData(0,0,W,H), d=img.data, hist=new Array(256).fill(0), L=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){ const l=Math.round(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]); L[i]=l; hist[l]++; }
  // Ambang Otsu + pelarasan pengguna
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i]; let sB=0,wB=0,best=0,th=160;
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=W*H-wB; if(!wF) break; sB+=t*hist[t]; const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>best){best=v;th=t;} }
  th=Math.max(40,Math.min(235,th+ +$("sgThr").value));
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ const i=y*W+xx, l=L[i];
    if(l>=th){ d[i*4+3]=0; } else { const a=Math.min(255,Math.round((th-l)/th*255*1.6)); d[i*4]=13; d[i*4+1]=42; d[i*4+2]=107; d[i*4+3]=Math.max(a,120);
      if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; } }
  x.putImageData(img,0,0);
  if(x1<=x0){ $("sgPrev").innerHTML='<div class="msg err">Tandatangan tidak dikesan. Cuba gambar yang lebih jelas atau laraskan kepekaan.</div>'; window._sigUp=null; return; }
  const p=12; x0=Math.max(0,x0-p); y0=Math.max(0,y0-p); x1=Math.min(W,x1+p); y1=Math.min(H,y1+p);
  const k=Math.min(1,600/(x1-x0)), o=document.createElement("canvas"); o.width=Math.round((x1-x0)*k); o.height=Math.round((y1-y0)*k);
  o.getContext("2d").drawImage(c,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);
  if((x1-x0)*(y1-y0)>W*H*.85) toast("Latar mungkin tidak dibuang sepenuhnya — cuba laraskan kepekaan.",true);
  window._sigUp=o.toDataURL("image/png");
  $("sgPrev").innerHTML=`<div class="sugg">Pratonton (latar telus):<div style="margin-top:8px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/16px 16px;border-radius:8px;padding:10px;text-align:center"><img src="${window._sigUp}" style="max-height:110px;max-width:100%"></div></div>`;
}
async function saveMySig(btn){
  let sig=null; if(window._sigMode==="u"){ sig=window._sigUp; if(!sig) return toast("Sila muat naik gambar tandatangan.",true); } else { if(!window._mySig.has()) return toast("Sila lukis tandatangan.",true); sig=window._mySig.png(); }
  btn.disabled=true; try{ await api("sigSave",{signature:sig}); USER.adaTandatangan=true; toast("Tandatangan disimpan."); R.akaun(); }catch(e){ toast(e.message,true); btn.disabled=false; } }
async function chPw(btn){
  if($("cp1").value!==$("cp2").value) return toast("Kata laluan baharu tidak sepadan.",true);
  btn.disabled=true; try{ await api("changePassword",{oldPassword:$("cp0").value,newPassword:$("cp1").value}); toast("Kata laluan ditukar."); const was=USER.mustChange; USER.mustChange=false; try{sessionStorage.setItem("pppkank_user",JSON.stringify(USER))}catch(e){} was?go("utama"):R.akaun(); }catch(e){ toast(e.message,true); btn.disabled=false; }
}

/* ---------- LUPA KATA LALUAN ---------- */
const pwBox=(id,ph)=>`<div class="pw"><input id="${id}" type="password" autocomplete="new-password" placeholder="${ph||""}"><button type="button" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'LIHAT':'SOROK'">LIHAT</button></div>`;
function backToLogin(){ history.replaceState(null,"",location.pathname); $("forgot").hidden=true; $("login").hidden=false; }
function showForgot(){
  $("login").hidden=true; $("forgot").hidden=false;
  $("fgCard").innerHTML=`<img src="${document.querySelector('.lcard img').src}" alt=""><h1>Lupa kata laluan</h1><p class="s">Masukkan nama pengguna atau emel berdaftar. Pautan set semula akan dihantar ke emel akaun anda.</p>
    <label class="l">Nama pengguna atau emel</label><input id="fgId" autocapitalize="none" value="${esc($("lu").value)}">
    <button class="btn b-green" id="fgBtn">Hantar pautan set semula</button><div id="fgMsg"></div>
    <p class="s" style="margin-top:14px;margin-bottom:0"><a href="#" onclick="backToLogin();return false" style="color:var(--g7);font-weight:700">← Kembali ke log masuk</a></p>
    <p class="s" style="font-size:.78rem;margin-top:10px">Tiada emel berdaftar? Hubungi Pentadbir Sistem untuk menetapkan semula kata laluan anda.</p>`;
  $("fgBtn").onclick=async()=>{ const b=$("fgBtn"); b.disabled=true; b.textContent="Menghantar…";
    try{ const j=await api("forgot",{id:$("fgId").value.trim()}); $("fgMsg").innerHTML=`<div class="msg ok">${esc(j.message)}</div>`; b.textContent="Dihantar"; }
    catch(e){ $("fgMsg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; b.disabled=false; b.textContent="Hantar pautan set semula"; } };
}
async function showReset(token){
  $("login").hidden=true; $("forgot").hidden=false; const logo=document.querySelector('.lcard img').src;
  $("fgCard").innerHTML=`<img src="${logo}" alt=""><h1>Kata laluan baharu</h1><div class="loading"><div class="spin"></div>Menyemak pautan…</div>`;
  try{
    const j=await api("resetPw",{token,check:true});
    $("fgCard").innerHTML=`<img src="${logo}" alt=""><h1>Kata laluan baharu</h1><p class="s">Akaun: <b>${esc(j.username)}</b></p>
      <label class="l">Kata laluan baharu (min. 8 aksara)</label>${pwBox("rp1")}
      <label class="l">Ulang kata laluan baharu</label>${pwBox("rp2")}
      <button class="btn b-green" id="rpBtn">Tetapkan kata laluan</button><div id="rpMsg"></div>`;
    $("rpBtn").onclick=async()=>{ const a=$("rp1").value,b2=$("rp2").value;
      if(a.length<8) return $("rpMsg").innerHTML=`<div class="msg err">Kata laluan mesti sekurang-kurangnya 8 aksara.</div>`;
      if(a!==b2) return $("rpMsg").innerHTML=`<div class="msg err">Kata laluan tidak sepadan.</div>`;
      $("rpBtn").disabled=true;
      try{ const k=await api("resetPw",{token,password:a}); backToLogin(); $("lu").value=j.username; $("lmsg").innerHTML=`<div class="msg ok">${esc(k.message)}</div>`; }
      catch(e){ $("rpMsg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; $("rpBtn").disabled=false; } };
  }catch(e){ $("fgCard").innerHTML=`<img src="${logo}" alt=""><h1>Pautan tidak sah</h1><div class="msg err">${esc(e.message)}</div><button class="btn b-green" onclick="showForgot()">Mohon pautan baharu</button>`; }
}

/* ---------- MULA ---------- */
function start(){
  $("login").hidden=true; $("app").hidden=false; buildNav();
  const h=location.hash.slice(1); go(PAGES.some(p=>p.id===h)?h:"utama");
  api("pkbList").then(j=>{ CACHE.pkbMode=j.mode; CACHE.todoP=j.todo; setExpCnt(); }).catch(()=>{});
  api("tntList").then(j=>{ CACHE.todoT=j.todo; setExpCnt(); }).catch(()=>{});
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
const RESET_TOK=new URLSearchParams(location.search).get("reset");
if(RESET_TOK){ showReset(RESET_TOK); } else if(TOKEN&&USER){ api("me").then(j=>{ USER=j.user; start(); }).catch(()=>{}); }
</script>
