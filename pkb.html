<style>
:root{--g9:#14361a;--g8:#1d4a22;--g7:#28602c;--g6:#2f7233;--g1:#e4efe2;--g0:#f1f7ef;--gold:#e3a923;--gold6:#c98f12;--gold3:#f2cf73;--gold1:#fbf0d2;
--cream:#fbf9f3;--ink:#18231a;--muted:#5b6a5d;--line:#e2e6dc;--red:#b3261e;--red0:#fdecea;--sans:"Plus Jakarta Sans",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{width:min(900px,100% - 28px);margin-inline:auto}
header{background:linear-gradient(160deg,var(--g9),var(--g7));color:#fff;padding:26px 0 70px}
.hb{display:flex;gap:14px;align-items:center}
.hb img{width:58px;height:58px;background:#fff;border-radius:50%}
.hb small{display:block;color:var(--gold3);font-weight:800;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
.hb h1{font-family:var(--serif);font-size:clamp(1.4rem,3.6vw,2rem);line-height:1.15}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;font-size:.78rem}
.flow span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:999px}
.flow b{color:var(--gold3)}
main{margin-top:-46px;padding-bottom:50px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 10px 30px -18px rgba(20,54,26,.35)}
.card h2{font-size:1.02rem;color:var(--g9);margin-bottom:4px;display:flex;gap:10px;align-items:center}
.card h2 i{font-style:normal;background:var(--g7);color:#fff;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;flex:none}
.card p.s{color:var(--muted);font-size:.86rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.full{grid-column:1/-1}
label.l{display:block;font-size:.8rem;font-weight:800;color:var(--g8);margin-bottom:5px}
label.l em{color:var(--red);font-style:normal}label.l small{font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.95rem;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g6);background:#fff}
.bad{border-color:var(--red)!important;background:var(--red0)!important}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.radios input{width:auto;accent-color:var(--g7)}
.radios label:has(input:checked){border-color:var(--g6);background:var(--g0)}
table.it{width:100%;border-collapse:collapse;font-size:.9rem}
table.it th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px}
table.it td{padding:4px}
table.it input{padding:8px 9px;font-size:.9rem}
table.it .num{text-align:right}
.x{border:0;background:var(--red0);color:var(--red);width:30px;height:30px;border-radius:8px;font-weight:800;cursor:pointer}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--g0);font-weight:800;color:var(--g9)}
.tot b{font-family:var(--serif);font-size:1.5rem}
.warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--gold1);color:#6b4a00;font-size:.85rem}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--g7)}
.files{margin-top:8px;display:grid;gap:6px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--g0);border-radius:10px;padding:7px 10px;font-size:.84rem}
.sigw{border:2px solid var(--line);border-radius:14px;background:#fff;position:relative;touch-action:none}
.sigw canvas{display:block;width:100%;height:160px;cursor:crosshair}
.sigw .ln{position:absolute;left:20px;right:20px;bottom:36px;border-bottom:1.5px dashed #c9d1c6;pointer-events:none}
.sigw .ph{position:absolute;inset:0;display:grid;place-items:center;color:#a6b0a7;font-weight:600;pointer-events:none}
.sigbar{display:flex;justify-content:flex-end;margin-top:4px}
.lk{background:none;border:0;color:var(--red);font:inherit;font-weight:700;font-size:.82rem;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font:inherit;font-weight:800;font-size:.93rem;border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.b-green{background:var(--g7);color:#fff}.b-gold{background:var(--gold);color:var(--g9)}.b-ghost{background:#fff;border-color:var(--line);color:var(--g8)}.b-red{background:#fff;border-color:#f0c4c0;color:var(--red)}
.btn[disabled]{opacity:.55;pointer-events:none}
.msg{padding:12px 14px;border-radius:12px;font-size:.9rem;margin-top:12px}.msg.err{background:var(--red0);color:var(--red)}.msg.ok{background:#e3f4df;color:#1e6b25}.msg.info{background:var(--gold1);color:#6b4a00}
.ov{position:fixed;inset:0;background:rgba(20,54,26,.65);display:grid;place-items:center;z-index:99}.ov div{background:#fff;padding:26px 30px;border-radius:18px;text-align:center;font-weight:700;color:var(--g9)}
.spin{width:40px;height:40px;margin:0 auto 12px;border:4px solid var(--g1);border-top-color:var(--g7);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.st{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--gold1);color:#7a5200}
.st.g{background:#e1f3dd;color:#1e6b25}.st.r{background:var(--red0);color:var(--red)}
.steps{display:flex;gap:4px;margin:16px 0 4px;flex-wrap:wrap}
.steps div{flex:1;min-width:90px;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.steps div::before{content:"";display:block;height:6px;border-radius:999px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--g8)}.steps div.on::before{background:var(--g6)}
.tl{list-style:none;margin-top:10px}
.tl li{border-left:2px solid var(--g1);padding:0 0 12px 14px;position:relative;font-size:.88rem}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl small{color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:.9rem}.kv dt{color:var(--muted);font-weight:600}.kv dd{font-weight:700}
.ref{font-family:var(--serif);font-size:1.6rem;color:var(--g9)}
.linkbox{display:flex;gap:8px;margin-top:8px}.linkbox input{font-size:.8rem}
@media (max-width:640px){.grid,.checks{grid-template-columns:1fr}.card{padding:18px}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
 table.it thead{display:none}table.it tr{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}table.it td:first-child{grid-column:1/-1}}
</style>
</head>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFLxLtxB4NPNncqNmOOx8N8UD1HSmKuCRKxQqFA0OPl-s9yC2eCsKtuyAs7FhHYBc/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rm=n=>Number(n||0).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(action,data={}){ const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action},data))}); const j=await r.json(); if(!j.ok) throw new Error(j.message||"Ralat."); return j; }
function busy(on,t){ $("ov").hidden=!on; if(t) $("ovT").textContent=t; }
function b64Blob(b64,type){ const bin=atob(b64),u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
function dl(f){ const url=URL.createObjectURL(b64Blob(f.data,f.mime)); const a=document.createElement("a"); a.href=url; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }
function readFile(file){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok({name:file.name,type:file.type||"application/octet-stream",data:String(r.result).split(",")[1],size:file.size}); r.onerror=no; r.readAsDataURL(file); }); }

/* ---------- Pad tandatangan ---------- */
function SigPad(host){
  host.innerHTML=`<div class="sigw"><canvas></canvas><div class="ln"></div><div class="ph">Tandatangan di sini</div></div><div class="sigbar"><button type="button" class="lk">Padam</button></div>`;
  const w=host.querySelector(".sigw"), cv=host.querySelector("canvas"), cx=cv.getContext("2d"), ph=host.querySelector(".ph"); let draw=false,has=false,last=null;
  const size=()=>{ const r=cv.getBoundingClientRect(); if(!r.width) return; const d=Math.max(2,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; cx.setTransform(d,0,0,d,0,0); cx.lineCap="round"; cx.lineJoin="round"; cx.strokeStyle="#0d2a6b"; cx.lineWidth=2.3; has=false; ph.style.display=""; };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown",e=>{ if(!cv.width) size(); draw=true; last=pos(e); cv.setPointerCapture(e.pointerId); has=true; ph.style.display="none"; w.classList.remove("bad"); });
  cv.addEventListener("pointermove",e=>{ if(!draw) return; const p=pos(e); cx.beginPath(); cx.moveTo(last.x,last.y); cx.lineTo(p.x,p.y); cx.stroke(); last=p; });
  ["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>draw=false));
  host.querySelector(".lk").onclick=size; setTimeout(size,50);
  return { has:()=>has, mark:()=>w.classList.add("bad"), png:()=>{
    const W=cv.width,H=cv.height,d=cx.getImageData(0,0,W,H).data; let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2) if(d[(y*W+x)*4+3]>10){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
    if(x1<=x0) return null; const p=14; x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(W,x1+p);y1=Math.min(H,y1+p);
    const s=Math.min(1,600/(x1-x0)), o=document.createElement("canvas"); o.width=Math.round((x1-x0)*s); o.height=Math.round((y1-y0)*s);
    o.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height); return o.toDataURL("image/png"); } };
}

/* ---------- Borang PKB (baharu / pembetulan) ---------- */
let INFO={jenis:["Bekalan","Perkhidmatan","Kerja"],dokumen:[],had:{jk:20000,ma:50000},jawatankuasa:[]}, FILES=[], PAD=null, EDIT=null;
function itemRow(it={}){ return `<tr><td><input class="ib" placeholder="cth: Bayaran penceramah KIHC 2027" value="${esc(it.butiran||"")}"></td><td><input class="iq num" type="number" min="0" step="any" value="${esc(it.kuantiti||1)}"></td><td><input class="iu" placeholder="unit" value="${esc(it.unit||"")}"></td><td><input class="ih num" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(it.harga||"")}"></td><td class="num ij">0.00</td><td><button type="button" class="x" onclick="this.closest('tr').remove();calc()">×</button></td></tr>`; }
function calc(){ let t=0; document.querySelectorAll("#items tbody tr").forEach(tr=>{ const j=(+tr.querySelector(".iq").value||0)*(+tr.querySelector(".ih").value||0); tr.querySelector(".ij").textContent=rm(j); t+=j; });
  $("tot").textContent="RM"+rm(t); const w=$("thr"); w.hidden=t<=INFO.had.jk; w.textContent=t>INFO.had.ma?"Melebihi RM50,000: perlu kebenaran Mesyuarat Agung terlebih dahulu (Fasal 10.4 Perlembagaan).":"Melebihi RM20,000: perlu kelulusan Jawatankuasa terlebih dahulu (Fasal 10.4 Perlembagaan). Bendahari akan merekod rujukan minit mesyuarat."; }
function formHTML(e){
  e=e||{}; const dok=String(e.dokumen||"");
  return `
  ${EDIT?`<div class="card" style="border-color:var(--gold)"><h2>Pembetulan PKB ${esc(EDIT.ref)}</h2><p class="s">Ulasan: <b>${esc(EDIT.ulasan||"-")}</b>. Sila buat pembetulan, tandatangan semula dan hantar.</p></div>`:
  `<div class="card"><h2>Sebelum mula</h2><p class="s" style="margin:0">Borang ini untuk <b>ahli berdaftar</b> persatuan (termasuk AJK) yang memohon kelulusan perbelanjaan wang persatuan. No. KP anda akan disemak dengan senarai ahli. Selepas dihantar, anda akan menerima <b>pautan semakan status</b> melalui emel.</p></div>`}

    <input type="file" id="lamp" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" style="margin-top:10px">
    <div class="files" id="flist"></div></div>
  <div class="card"><h2><i>✓</i>Pengakuan &amp; tandatangan pemohon</h2>
    <label class="chk" style="margin-bottom:12px"><input type="checkbox" id="pengakuan"> Saya mengesahkan maklumat yang diberikan adalah benar dan perbelanjaan ini adalah untuk kepentingan persatuan.</label>
    <div id="pad"></div>
    <div id="fmsg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">${EDIT?`<button type="button" class="btn b-ghost" onclick="track(EDIT.token)">Batal</button>`:""}<button class="btn b-gold" id="sbtn">${EDIT?"Hantar semula":"Hantar PKB"}</button></div></div>
  </form>`;
}
async function renderForm(e){
  $("app").innerHTML=formHTML(e); FILES=[]; PAD=SigPad($("pad")); calc();
  $("items").addEventListener("input",calc);
  $("nokp").addEventListener("input",ev=>{ const d=ev.target.value.replace(/\D/g,"").slice(0,12); ev.target.value=d.length>8?`${d.slice(0,6)}-${d.slice(6,8)}-${d.slice(8)}`:d.length>6?`${d.slice(0,6)}-${d.slice(6)}`:d; });
  $("lamp").onchange=async ev=>{ for(const f of ev.target.files){ FILES.push(await readFile(f)); } ev.target.value=""; drawFiles(); };
  $("f").onsubmit=submit;
}
function drawFiles(){ const tot=FILES.reduce((a,b)=>a+b.size,0); $("flist").innerHTML=FILES.map((f,i)=>`<div class="fi"><span>📎 ${esc(f.name)} · ${(f.size/1048576).toFixed(2)} MB</span><button type="button" class="lk" onclick="FILES.splice(${i},1);drawFiles()">Buang</button></div>`).join("")+(tot>15*1048576?`<div class="msg err">Jumlah saiz melebihi 15 MB.</div>`:""); }
async function submit(ev){
  ev.preventDefault(); $("fmsg").innerHTML="";
  const v=id=>($(id)||{}).value?.trim()||"";
  const items=[...document.querySelectorAll("#items tbody tr")].map(tr=>({butiran:tr.querySelector(".ib").value.trim(),kuantiti:+tr.querySelector(".iq").value||1,unit:tr.querySelector(".iu").value.trim(),harga:+tr.querySelector(".ih").value||0})).filter(i=>i.butiran||i.harga);
  const jenis=(document.querySelector('input[name="jenis"]:checked')||{}).value;
  const req=["nama","nokp","jawatan","telefon","emel","jawatankuasa","penerima","justifikasi"]; let bad=null;
  req.forEach(id=>{ const el=$(id); const b=!el.value.trim(); el.classList.toggle("bad",b); if(b&&!bad) bad=el; });
  const err=m=>{ $("fmsg").innerHTML=`<div class="msg err">${esc(m)}</div>`; };
  if(bad){ bad.scrollIntoView({behavior:"smooth",block:"center"}); return err("Sila lengkapkan ruangan bertanda *."); }
  if(v("nokp").replace(/\D/g,"").length!==12) return err("No. KP mestilah 12 digit.");
  if(!jenis) return err("Sila pilih jenis perolehan.");
  if(!items.length||items.some(i=>!i.butiran||!(i.harga>0))) return err("Setiap butiran perolehan perlu ada keterangan dan harga.");
  if(FILES.reduce((a,b)=>a+b.size,0)>15*1048576) return err("Jumlah saiz lampiran melebihi 15 MB.");
  if(!$("pengakuan").checked) return err("Sila tandakan pengakuan.");
  if(!PAD.has()){ PAD.mark(); return err("Sila turunkan tandatangan."); }
  const payload={nama:v("nama"),nokp:v("nokp"),jawatan:v("jawatan"),telefon:v("telefon"),emel:v("emel"),jawatankuasa:v("jawatankuasa"),jenis,penerima:v("penerima"),bank:v("bank"),akaun:v("akaun"),
    items,justifikasi:v("justifikasi"),dokumen:[...document.querySelectorAll(".dk:checked")].map(x=>x.value),dokumenLain:v("dkLain"),
    lampiran:FILES.map(f=>({name:f.name,type:f.type,data:f.data})),signature:PAD.png(),pengakuan:true,website:document.querySelector('[name="website"]').value};
  if(!EDIT && v("pNama") && v("pEmel")) payload.penyokong={nama:v("pNama"),emel:v("pEmel")};
  $("sbtn").disabled=true; busy(true,"Menghantar PKB & menjana borang…");
  try{
    if(EDIT){ await api("pub_pkbResubmit",Object.assign({token:EDIT.token},payload)); busy(false); EDIT=null; return track(new URLSearchParams(location.search).get("t")); }
    const j=await api("pub_pkbSubmit",payload); busy(false); done(j);
  }catch(e){ busy(false); $("sbtn").disabled=false; err(e.message); }
}
function done(j){
  const link=location.origin+location.pathname+"?t="+j.token;
  $("app").innerHTML=`<div class="card" style="text-align:center;padding:34px 24px"><div style="font-size:2.4rem">✅</div><h2 style="justify-content:center;font-size:1.3rem">PKB telah dihantar</h2>
   <div class="ref">${esc(j.ref)}</div><p class="s" style="margin-top:6px">${j.penyokong?"Emel telah dihantar kepada penyokong untuk tandatangan sokongan. Selepas itu PKB akan disemak oleh Bendahari.":"PKB anda kini menunggu semakan Bendahari."} Salinan pautan juga dihantar ke emel anda.</p>
   <div style="max-width:560px;margin:14px auto 0;text-align:left"><label class="l">Pautan semakan status (simpan pautan ini)</label><div class="linkbox"><input readonly value="${esc(link)}" id="lnk"><button class="btn b-ghost" style="padding:8px 14px" onclick="navigator.clipboard&&navigator.clipboard.writeText($('lnk').value);this.textContent='Disalin ✓'">Salin</button></div></div>
   <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn b-green" onclick="pdf('${esc(j.token)}','pkb')">Muat turun borang PKB (PDF)</button><a class="btn b-ghost" href="${esc(link)}">Lihat status</a></div></div>`;
}
async function pdf(token,kind){ busy(true,"Menyediakan PDF…"); try{ dl(await api("pub_pkbPdf",{token,kind})); }catch(e){ alert(e.message); } busy(false); }

/* ---------- Semakan status ---------- */
const FLOW=["Dihantar","Semakan Bendahari","Kelulusan","Dibayar","Selesai"];
function stepIdx(s){ return {"Menunggu Sokongan":0,"Menunggu Semakan":1,"Dikuiri":1,"Menunggu Kelulusan":2,"Diluluskan":3,"Dibayar":3,"Selesai":4}[s]??0; }
const stClass=s=>/Selesai|Diluluskan|Dibayar/.test(s)?"g":/Tidak|Dibatalkan|Dikuiri/.test(s)?"r":"";
function summaryHTML(r){ return `<dl class="kv"><dt>Jawatankuasa</dt><dd>${esc(r.jawatankuasa)}</dd><dt>Jenis perolehan</dt><dd>${esc(r.jenis)}</dd><dt>Pemohon</dt><dd>${esc(r.pemohon)} (${esc(r.jawatanPemohon)})</dd><dt>Pembekal / penerima</dt><dd>${esc(r.penerima)}${r.bank?` · ${esc(r.bank)} ${esc(r.akaun)}`:""}</dd>
  <dt>Butiran</dt><dd>${r.items.map(i=>`${esc(i.butiran)} — ${esc(i.kuantiti)}${i.unit?" "+esc(i.unit):""} × RM${rm(i.harga)} = RM${rm(i.jumlah)}`).join("<br>")}</dd><dt>Jumlah</dt><dd style="font-size:1.1rem">RM${rm(r.jumlah)}</dd><dt>Justifikasi</dt><dd style="font-weight:500">${esc(r.justifikasi)}</dd></dl>`; }
async function track(token){
  $("ttl").textContent="Status PKB"; $("app").innerHTML=`<div class="card"><div class="spin"></div></div>`;
  try{
    const j=await api("pub_pkbTrack",{token}); const r=j.rec, si=stepIdx(j.status);
    $("app").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div class="ref">${esc(r.ref)}</div><small style="color:var(--muted)">Dihantar ${esc(r.tarikh)}</small></div><span class="st ${stClass(j.status)}">${esc(j.status)}</span></div>
      ${/Tidak|Dibatalkan/.test(j.status)?"":`<div class="steps">${FLOW.map((f,i)=>`<div class="${i<=si?"on":""}">${f}</div>`).join("")}</div>`}
      ${j.status==="Dikuiri"?`<div class="msg info"><b>Dikuiri:</b> ${esc(j.ulasan)}</div>`:""}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn b-green" onclick="pdf('${esc(token)}','pkb')">Borang PKB (PDF)</button>${j.hasVoucher?`<button class="btn b-ghost" onclick="pdf('${esc(token)}','baucar')">Baucar bayaran (PDF)</button>`:""}${j.canEdit?`<button class="btn b-gold" id="edBtn">Buat pembetulan</button>`:""}${j.canCancel?`<button class="btn b-red" onclick="cancelPkb('${esc(token)}')">Batalkan PKB</button>`:""}</div></div>
      <div class="card"><h2>Butiran</h2>${summaryHTML(r)}</div>
      <div class="card"><h2>Rekod tindakan</h2><ul class="tl">${j.trail.map(t=>`<li><b>${esc(t.tindakan)}</b><small>${esc(t.masa)}${t.oleh?" · "+esc(t.oleh):""}${t.jawatan?" ("+esc(t.jawatan)+")":""}</small>${t.ulasan?`<div>${esc(t.ulasan)}</div>`:""}</li>`).join("")}</ul></div>`;
    if(j.canEdit) $("edBtn").onclick=async()=>{ EDIT={token,ref:r.ref,ulasan:j.ulasan}; await loadInfo(); const e=j.edit; renderForm(e); };
  }catch(e){ $("app").innerHTML=`<div class="card"><div class="msg err">${esc(e.message)}</div></div>`; }
}
async function cancelPkb(token){ const n=prompt("Batalkan PKB ini? Nyatakan sebab (pilihan):"); if(n===null) return; busy(true,"Membatalkan…"); try{ await api("pub_pkbCancel",{token,nota:n}); }catch(e){ alert(e.message); } busy(false); track(token); }

/* ---------- Sokongan penyokong ---------- */
async function sokong(token){
  $("ttl").textContent="Sokongan PKB (Bahagian 7)"; $("app").innerHTML=`<div class="card"><div class="spin"></div></div>`;
  try{
    const j=await api("pub_sokongGet",{token}); const r=j.rec;
    if(j.status!=="Menunggu Sokongan"){ $("app").innerHTML=`<div class="card"><div class="msg ok">PKB ${esc(r.ref)} tidak lagi menunggu sokongan (status: ${esc(j.status)}). Terima kasih.</div></div>`; return; }
    $("app").innerHTML=`<div class="card"><div class="ref">${esc(r.ref)}</div><p class="s">Anda dinamakan sebagai penyokong permohonan ini.</p>${summaryHTML(r)}</div>
     <div class="card"><h2>Sokongan anda</h2><div class="grid"><div><label class="l">Nama <em>*</em></label><input id="sn"></div><div><label class="l">Jawatan <em>*</em></label><input id="sj" placeholder="cth: AJK Persatuan"></div><div class="full"><label class="l">Ulasan</label><textarea id="su" rows="2"></textarea></div></div>
     <label class="l" style="margin-top:12px">Tandatangan</label><div id="pad"></div><div id="fmsg"></div>
     <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn b-red" id="sno">Tidak menyokong</button><button class="btn b-gold" id="syes">Sokong &amp; tandatangan</button></div></div>`;
    const pad=SigPad($("pad")); const go=async setuju=>{
      const nama=$("sn").value.trim(), jaw=$("sj").value.trim(); if(!nama||!jaw) return $("fmsg").innerHTML=`<div class="msg err">Nama dan jawatan diperlukan.</div>`;
      if(setuju&&!pad.has()){ pad.mark(); return $("fmsg").innerHTML=`<div class="msg err">Sila turunkan tandatangan.</div>`; }
      if(!setuju&&!$("su").value.trim()) return $("fmsg").innerHTML=`<div class="msg err">Sila nyatakan ulasan.</div>`;
      busy(true,"Menghantar…"); try{ const k=await api("pub_sokongSign",{token,nama,jawatan:jaw,ulasan:$("su").value,setuju,signature:setuju?pad.png():null}); $("app").innerHTML=`<div class="card"><div class="msg ok">${esc(k.message)}</div></div>`; }catch(e){ $("fmsg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; } busy(false); };
    $("syes").onclick=()=>go(true); $("sno").onclick=()=>go(false);
  }catch(e){ $("app").innerHTML=`<div class="card"><div class="msg err">${esc(e.message)}</div></div>`; }
}

/* ---------- Pengesahan penerimaan bayaran ---------- */
async function terima(token){
  $("ttl").textContent="Pengesahan Penerimaan Bayaran"; $("app").innerHTML=`<div class="card"><div class="spin"></div></div>`;
  try{
    const j=await api("pub_terimaGet",{token}); const r=j.rec;
    if(j.sudah){ $("app").innerHTML=`<div class="card"><div class="msg ok">Penerimaan bayaran bagi baucar ${esc(j.baucar)} telah disahkan. Terima kasih.</div></div>`; return; }
    $("app").innerHTML=`<div class="card"><h2>Baucar Bayaran ${esc(j.baucar)}</h2><dl class="kv"><dt>Dibayar kepada</dt><dd>${esc(r.penerima)}</dd><dt>Amaun</dt><dd style="font-size:1.2rem">RM${rm(j.amaun)}</dd><dt>Tarikh</dt><dd>${esc(j.tarikh)}</dd><dt>Cara bayaran</dt><dd>${esc(j.cara)}</dd><dt>Rujukan PKB</dt><dd>${esc(r.ref)} — ${esc(r.jawatankuasa)}</dd></dl></div>
     <div class="card"><h2>Pengesahan penerimaan</h2><p class="s">Saya mengaku telah menerima bayaran berjumlah seperti yang dinyatakan di atas sebagai bayaran penuh dan muktamad.<br><i>I hereby acknowledge receipt of the payment amount as stated above as full and final settlement.</i></p>
     <label class="l">Nama penerima <em>*</em></label><input id="tn" value="${esc(r.penerima)}"><label class="l" style="margin-top:12px">Tandatangan <em>*</em></label><div id="pad"></div><div id="fmsg"></div>
     <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn b-gold" id="tb">Sahkan penerimaan</button></div></div>`;
    const pad=SigPad($("pad"));
    $("tb").onclick=async()=>{ if(!$("tn").value.trim()||!pad.has()){ pad.mark(); return $("fmsg").innerHTML=`<div class="msg err">Nama dan tandatangan diperlukan.</div>`; }
      busy(true,"Merekod…"); try{ const k=await api("pub_terimaSign",{token,nama:$("tn").value.trim(),signature:pad.png()}); $("app").innerHTML=`<div class="card"><div class="msg ok">${esc(k.message)}</div></div>`; }catch(e){ $("fmsg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; } busy(false); };
  }catch(e){ $("app").innerHTML=`<div class="card"><div class="msg err">${esc(e.message)}</div></div>`; }
}

/* ---------- Mula ---------- */
async function loadInfo(){ try{ const j=await api("pub_pkbInfo"); INFO=j; }catch(e){} }
(async()=>{
  const q=new URLSearchParams(location.search);
  if(q.get("t")) return track(q.get("t"));
  if(q.get("s")) return sokong(q.get("s"));
  if(q.get("v")) return terima(q.get("v"));
  $("app").innerHTML=`<div class="card"><div class="spin"></div></div>`; await loadInfo(); renderForm();
})();
</script>
</body>
</html>
